<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:240px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:0;background:#fff}
.header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#f8f9fa;border-bottom:1px solid #e8eaed}
.header img{width:32px;height:32px;border-radius:8px}
.header-text{flex:1}
.header-text h1{font-size:14px;font-weight:600;color:#202124;line-height:1.3}
.header-text p{font-size:11px;color:#5f6368}
.switch{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:20px;transition:.2s}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.slider{background:#1a73e8}
input:checked+.slider:before{transform:translateX(16px)}
.section{padding:12px 16px}
.section-title{font-size:11px;font-weight:600;color:#5f6368;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.radio-group{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.radio-group label{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e8eaed;border-radius:8px;cursor:pointer;font-size:13px;color:#202124;transition:.15s}
.radio-group label:hover{border-color:#1a73e8;background:#f0f6ff}
.radio-group input[type="radio"]{accent-color:#1a73e8;width:14px;height:14px;margin:0;flex-shrink:0}
.status-bar{display:flex;align-items:center;gap:6px;padding:8px 16px;border-top:1px solid #e8eaed;font-size:11px;color:#5f6368}
.status-dot{width:6px;height:6px;border-radius:50%;background:#34a853;flex-shrink:0}
.status-dot.off{background:#ccc}
</style></head>
<body>
<div class="header">
  <img src="icons/icon48.png" alt="logo" id="logo">
  <div class="header-text">
    <h1>More Results</h1>
    <p>Results per page</p>
  </div>
  <label class="switch">
    <input type="checkbox" id="toggle">
    <span class="slider"></span>
  </label>
</div>
<div class="section">
  <div class="section-title">Results per page</div>
  <div class="radio-group" id="options"></div>
</div>
<div class="status-bar">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText">Active</span>
</div>
<script src="popup.js"></script>
</body>
</html>
